# cargo-audit configuration.
#
# Every entry below is an `unmaintained`/`unsound` advisory (NOT an exploitable
# vulnerability) coming from Tauri's own transitive dependency tree, which we
# can't upgrade independently:
#   - gtk-rs GTK3 bindings (atk/gdk/gdkx11/gtk/...): Tauri's Linux webview
#     (webkit2gtk-4.1) requires GTK3; the gtk-rs team deprecated the GTK3
#     bindings in favor of GTK4, so they're flagged unmaintained with no fix.
#   - glib unsound (RUSTSEC-2024-0429): same gtk-rs 0.18 stack.
#   - paste / proc-macro-error / unic-*: unmaintained proc-macro & unicode
#     helpers pulled in transitively; no maintained drop-in is available to us.
#
# `cargo audit --deny warnings` still fails on any NEW advisory not listed here,
# so real vulnerabilities are not silenced. Revisit when Tauri moves to GTK4.
[advisories]
ignore = [
  "RUSTSEC-2024-0411", # gdkwayland-sys unmaintained
  "RUSTSEC-2024-0412", # gdk unmaintained
  "RUSTSEC-2024-0413", # atk unmaintained
  "RUSTSEC-2024-0414", # gdkx11-sys unmaintained
  "RUSTSEC-2024-0415", # gtk unmaintained
  "RUSTSEC-2024-0416", # atk-sys unmaintained
  "RUSTSEC-2024-0417", # gdkx11 unmaintained
  "RUSTSEC-2024-0418", # gdk-sys unmaintained
  "RUSTSEC-2024-0419", # gtk3-macros unmaintained
  "RUSTSEC-2024-0420", # gtk-sys unmaintained
  "RUSTSEC-2024-0429", # glib unsound (gtk-rs 0.18 stack)
  "RUSTSEC-2024-0370", # proc-macro-error unmaintained
  "RUSTSEC-2024-0436", # paste unmaintained
  "RUSTSEC-2025-0075", # unic-char-range unmaintained
  "RUSTSEC-2025-0080", # unic-common unmaintained
  "RUSTSEC-2025-0081", # unic-char-property unmaintained
  "RUSTSEC-2025-0098", # unic-ucd-version unmaintained
  "RUSTSEC-2025-0100", # unic-ucd-ident unmaintained
]
