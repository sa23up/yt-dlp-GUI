name: Feature Request / 功能请求
description: 为这个项目提出新想法 / Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出新想法！/ Thanks for suggesting a new idea!

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Description
      description: 这个功能解决什么问题？/ What problem does this feature solve?
      placeholder: 我在使用时遇到的困扰是... / The frustration I experience is...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案 / Proposed Solution
      description: 你期望如何解决这个问题？/ How would you like this to be solved?
      placeholder: 我希望能够... / I would like to be able to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你考虑过哪些备选方案？/ What alternatives have you considered?
      placeholder: 另一种方式是... / An alternative approach could be...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 任何其他有助于理解这个请求的信息 / Any other info to help understand this request
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级 / Priority
      description: 这个功能对你有多重要？/ How important is this feature to you?
      options:
        - 高 / High - 没有它很难使用 / Hard to use without it
        - 中 / Medium - 会明显改善体验 / Would significantly improve experience
        - 低 / Low - 锦上添花 / Nice to have
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: 检查清单 / Checklist
      options:
        - label: 我已搜索现有 Issues，未发现重复 / I searched existing issues and found no duplicates
          required: true
        - label: 这个功能符合项目范围（视频下载相关）/ This feature fits project scope (video download related)
          required: true
