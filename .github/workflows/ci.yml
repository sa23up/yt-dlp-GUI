name: CI

on:
  push:
    branches: [main]
  pull_request:

# All jobs only read the repo; never grant the default token more than that.
permissions:
  contents: read

jobs:
  rust:
    name: Rust check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --no-deps -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --quiet
      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install --locked cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  frontend:
    name: Frontend type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: Type check
        run: npx vue-tsc -p tsconfig.json --noEmit
      - name: Vite build
        run: npx vite build
      - name: npm audit (high+ only)
        run: npm audit --omit=dev --audit-level=high

  bindings:
    name: TS bindings up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-bindings-${{ hashFiles('src-tauri/Cargo.lock') }}
      # The `export_bindings_up_to_date` test in lib.rs writes src/bindings.ts
      # via tauri-specta; we then assert the working copy is unchanged.
      - name: Regenerate bindings via cargo test
        working-directory: src-tauri
        run: cargo test --quiet export_bindings_up_to_date
      - name: Assert bindings.ts unchanged
        run: |
          if ! git diff --exit-code src/bindings.ts; then
            echo "::error::src/bindings.ts is stale — run 'cargo test export_bindings_up_to_date' in src-tauri and commit the result." >&2
            exit 1
          fi

  windows:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      # Windows runners ship MSVC + WebView2, so no system-dependency step is
      # needed (unlike the Linux jobs). This job exists to compile the
      # Windows-only `#[cfg(target_os = "windows")]` code paths per-PR.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-wincheck-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
